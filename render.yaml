services:
  # ================================================================
  # خدمة الخادم (Node.js) — encargada بالإشارات (WebSocket)
  # ================================================================
  - type: web
    name: videoshot-server
    env: node
    plan: free
    region: oregon
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: PORT
        value: 10000

  # ================================================================
  # الموقع الثابت (Static Site) — واجهة المستخدم (HTML/CSS/JS)
  # ================================================================
  - type: static
    name: videoshot-client
    buildCommand: "echo 'Static site ready'"
    staticPublishPath: "."
